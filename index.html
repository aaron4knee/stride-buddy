<style>
:root { --bg:#F3F8F5; --surface:#FFFFFF; --ink:#1F3A3D; --muted:#587079; --line:#DCE8E3; --mint:#0B8475; --err:#B4540C; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0F1A19; --surface:#162624; --ink:#E4F1EE; --muted:#A2BBB6; --line:#26403B; --mint:#5FD6B7; --err:#F5A15E; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink); font-family:Lato, system-ui, sans-serif; }
.card { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:28px; overflow:hidden; }
.meadow { height:120px; background-color:#86CF6A; background-image:radial-gradient(circle at 12% 8%, #EEFB8C 0%, rgba(238,251,140,0) 45%), radial-gradient(circle at 92% 20%, #4FAE62 0%, rgba(79,174,98,0) 40%), linear-gradient(180deg, #C9F17A 0%, #94D86C 45%, #5DB565 100%); display:grid; place-items:center; }
.egg { width:56px; height:70px; border-radius:50% 50% 46% 46% / 58% 58% 42% 42%; background:radial-gradient(circle at 35% 30%, #FFFFFF 0%, #FBF3DD 55%, #EADBB4 100%); position:relative; box-shadow:0 8px 0 -2px rgba(30,70,40,0.18); }
.egg::before, .egg::after { content:""; position:absolute; border-radius:50%; background:#4CC9F0; }
.egg::before { width:14px; height:10px; left:12px; top:24px; }
.egg::after { width:10px; height:8px; right:12px; top:40px; }
.busy .egg { animation: wiggle 0.9s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
@media (prefers-reduced-motion: reduce) { .busy .egg { animation: none; } }
form { padding:28px 28px 32px; display:flex; flex-direction:column; gap:14px; }
.eyebrow { font-size:12px; font-weight:900; letter-spacing:0.14em; text-transform:uppercase; color:var(--mint); }
h1 { margin:0; font-family:Fredoka, Lato, sans-serif; font-weight:600; font-size:34px; line-height:1.1; }
p { margin:0; color:var(--muted); font-size:15px; line-height:1.5; }
label { font-size:14px; font-weight:700; margin-top:6px; }
input { width:100%; min-height:48px; padding:0 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font:16px Lato, system-ui, sans-serif; }
input:focus-visible { outline:3px solid var(--mint); outline-offset:2px; }
button { min-height:48px; border:0; border-radius:999px; background:linear-gradient(90deg, #22A88C, #0B8475); color:#FFFFFF; font:700 15px Lato, system-ui, sans-serif; letter-spacing:0.04em; cursor:pointer; margin-top:4px; }
button:disabled { opacity:0.7; cursor:progress; }
button:focus-visible { outline:3px solid var(--mint); outline-offset:3px; }
.err { color:var(--err); font-size:14px; font-weight:700; min-height:1px; }
noscript p { padding:0 28px 28px; }
</style>
</head>

<script>
(function () {
  var KEY_STORE = "sb_key_v1";
  var DAYS = 30;
  var data = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("gate");
  var input = document.getElementById("pw");
  var err = document.getElementById("err");
  var go = document.getElementById("go");
  var card = document.getElementById("card");

  function fromB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(u) { var s = ""; u = new Uint8Array(u); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function decryptWith(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(data.iv) }, key, fromB64(data.ct))
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  function remember(key) {
    return crypto.subtle.exportKey("raw", key).then(function (raw) {
      try { localStorage.setItem(KEY_STORE, JSON.stringify({ k: toB64(raw), exp: Date.now() + DAYS * 864e5, salt: data.salt })); } catch (e) {}
    }).catch(function () {});
  }

  function forget() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }

  // Returning visitor: reuse the saved key for this version of the page.
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY_STORE) || "null"); } catch (e) { saved = null; }
  if (saved && saved.salt === data.salt && saved.exp > Date.now()) {
    crypto.subtle.importKey("raw", fromB64(saved.k), { name: "AES-GCM" }, false, ["decrypt"])
      .then(decryptWith).then(show).catch(forget);
  } else if (saved) {
    forget();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    go.disabled = true;
    go.textContent = "Unlocking…";
    card.classList.add("busy");
    var enc = new TextEncoder();
    crypto.subtle.importKey("raw", enc.encode(input.value), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: fromB64(data.salt), iterations: data.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      })
      .then(function (key) {
        return decryptWith(key).then(function (html) { return remember(key).then(function () { show(html); }); });
      })
      .catch(function () {
        go.disabled = false;
        go.textContent = "View the concept";
        card.classList.remove("busy");
        err.textContent = "That password didn't work. Try again.";
        input.select();
      });
  });
})();
</script>
